name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-partner/requirements-export.txt

      - name: Build the test AI partner model (Altlando architecture, random weights, exported to ONNX)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r ai-partner/requirements-export.txt
          npm run build:test-model

      - name: Unit tests
        run: npm run test:unit

      - name: Browser tests
        run: npm run test:browser
